[Network]
; Runtime master switch.
Enabled=1

; Legacy UDP settings below are ignored by the default private STR-only build.
; They only matter if the DLL is rebuilt with STRPM_ENABLE_UDP_BACKEND=ON.
LocalPort=27990
AutoDiscovery=1

; 1 = report "target not found" until at least one peer is known/configured.
; This avoids silent false positives in remote/no-port tests where LAN
; broadcast cannot reach the other player.
RequireKnownPeer=1

RelayMode=0
DiscoveryIntervalMs=1500
PeerTimeoutMs=15000

RemotePeer1=
RemotePeer2=
RemotePeer3=
RemotePeer4=

[Transport]
; STR = require the STR 1.8.0 chat-tunnel bridge and never open legacy UDP.
Mode=STR

; v0.4.7: both DLLs live in Data\SKSE\Plugins. The broker resolves this bare
; module name relative to its own directory. The bridge may start before the
; player connects with F2. Resolver memory is copied through ReadProcessMemory
; in bounded 1 MiB chunks, then scanned only from local snapshots. This keeps
; startup scans safe without the per-comparison ReadProcessMemory cost of v0.4.6.
STRBridgeModule=STRPluginMessagingBridge.dll

[Identity]
DisplayName=

[Security]
SharedSecret=
