[Network]
; Runtime master switch.
Enabled=1

; Legacy UDP settings below are ignored by the default private STR-only build.
; They only matter if the DLL is rebuilt with STRPM_ENABLE_UDP_BACKEND=ON.
LocalPort=27990
AutoDiscovery=1

; 1 = report "target not found" until at least one peer is known/configured.
; This avoids silent false positives in remote/no-port tests where LAN
; broadcast cannot reach the other player.
RequireKnownPeer=1

RelayMode=0
DiscoveryIntervalMs=1500
PeerTimeoutMs=15000

RemotePeer1=
RemotePeer2=
RemotePeer3=
RemotePeer4=

[Transport]
; STR = require the STR 1.8.0 chat-tunnel bridge and never open legacy UDP.
Mode=STR

; v0.6.0 keeps the validated v0.5.1 transport path unchanged and adds an
; independent runtime UI filter. It dynamically identifies
; OverlayService::OnChatMessageReceived and early-returns only when the incoming
; NotifyChatMessageBroadcast ChatMessage starts with STRPM|v2|. Normal STR chat
; continues through the original overlay path unchanged.
STRBridgeModule=STRPluginMessagingBridge.dll

[Identity]
DisplayName=

[Security]
SharedSecret=
