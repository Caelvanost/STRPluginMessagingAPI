[Network]
; Runtime master switch.
Enabled=1

; Legacy UDP settings below are ignored by the default private STR-only build.
; They only matter if the DLL is rebuilt with STRPM_ENABLE_UDP_BACKEND=ON.
LocalPort=27990
AutoDiscovery=1

; 1 = report "target not found" until at least one peer is known/configured.
; This avoids silent false positives in remote/no-port tests where LAN
; broadcast cannot reach the other player.
RequireKnownPeer=1

; Set to 1 on a public relay host that should forward packets between clients.
RelayMode=0

DiscoveryIntervalMs=1500
PeerTimeoutMs=15000

; Optional manual peers for Internet/direct setups.
; Format: host:port
RemotePeer1=
RemotePeer2=
RemotePeer3=
RemotePeer4=

[Transport]
; STR = require the STR 1.8.0 chat-tunnel bridge and never open the legacy UDP backend.
; Auto/UDP are only useful in custom development builds compiled with UDP on.
Mode=STR

; Packaged bridge module exporting STRPM_QueryTransportInterface.
STRBridgeModule=Data\SKSE\Plugins\STRPluginMessagingBridge.dll

[Identity]
; Leave empty to use the Windows computer name until a client mod calls
; setLocalDisplayName() with the real Skyrim player name.
DisplayName=

[Security]
; Optional HMAC-SHA256 shared secret. All players/relay hosts must match.
SharedSecret=
