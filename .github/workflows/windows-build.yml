name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build -A x64
          -DSTRPM_ENABLE_UDP_BACKEND=OFF
          -DSTRPM_BUILD_STR180_BRIDGE_PROBE=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify outputs
        shell: pwsh
        run: |
          $required = @(
            "build/Release/STRPluginMessagingAPI.dll",
            "build/Release/STRPluginMessagingBridge.dll"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing build output: $path"
            }
          }

      - name: Package Vortex test archive
        shell: pwsh
        run: |
          $stage = "artifact-vortex/Data/SKSE/Plugins"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/Release/STRPluginMessagingAPI.dll" "$stage/STRPluginMessagingAPI.dll"
          Copy-Item "build/Release/STRPluginMessagingBridge.dll" "$stage/STRPluginMessagingBridge.dll"
          Copy-Item "package/Data/SKSE/Plugins/STRPluginMessagingAPI.ini" "$stage/STRPluginMessagingAPI.ini"
          Compress-Archive -Path "artifact-vortex/*" -DestinationPath "STRPluginMessagingAPI-v0.4.8-test-Vortex.zip" -Force

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: STRPluginMessagingAPI-windows
          path: |
            build/Release/STRPluginMessagingAPI.dll
            build/Release/STRPluginMessagingBridge.dll

      - name: Upload Vortex package
        uses: actions/upload-artifact@v4
        with:
          name: STRPluginMessagingAPI-v0.4.8-test-Vortex
          path: STRPluginMessagingAPI-v0.4.8-test-Vortex.zip
