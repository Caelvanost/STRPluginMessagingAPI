name: Windows build

on:
  push:
    branches: [main, dev, 1.7-dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Skyrim 1.6.1170
        run: >-
          cmake -S . -B build-16 -A x64
          -DSTRPM_ENABLE_UDP_BACKEND=OFF
          -DSTRPM_BUILD_STR184_BRIDGE_PROBE=ON
          -DSTRPM_SKYRIM_RUNTIME=1.6.1170

      - name: Build Skyrim 1.6.1170
        run: cmake --build build-16 --config Release --parallel

      - name: Configure Skyrim 1.7.104
        run: >-
          cmake -S . -B build-17 -A x64
          -DSTRPM_ENABLE_UDP_BACKEND=OFF
          -DSTRPM_BUILD_STR184_BRIDGE_PROBE=ON
          -DSTRPM_SKYRIM_RUNTIME=1.7.104

      - name: Build Skyrim 1.7.104
        run: cmake --build build-17 --config Release --parallel

      - name: Verify outputs
        shell: pwsh
        run: |
          $required = @(
            "build-16/Release/STRPluginMessagingAPI.dll",
            "build-16/Release/STRPluginMessagingBridge.dll",
            "build-16/Release/STRPluginMessagingDiagnostic.dll",
            "build-17/Release/STRPluginMessagingAPI.dll",
            "build-17/Release/STRPluginMessagingBridge.dll",
            "build-17/Release/STRPluginMessagingDiagnostic.dll",
            "package/Data/SKSE/Plugins/STRPluginMessagingAPI.ini",
            "package/fomod/info.xml",
            "package/fomod/ModuleConfig.xml",
            "extras/str-server-resources/strpm-chat-relay/main.lua",
            "extras/str-server-resources/strpm-chat-relay/strpm-chat-relay.manifest"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing build/package input: $path"
            }
          }
          [xml](Get-Content -LiteralPath "package/fomod/info.xml" -Raw) | Out-Null
          [xml](Get-Content -LiteralPath "package/fomod/ModuleConfig.xml" -Raw) | Out-Null

      - name: Package unified release FOMOD archive
        shell: pwsh
        run: |
          $root = "artifact-release"
          $zip = "STRPluginMessagingAPI-v0.10.1.zip"
          $common = "$root/Common/SKSE/Plugins"
          $runtime16 = "$root/Runtime/Skyrim-1.6.1170/SKSE/Plugins"
          $runtime17 = "$root/Runtime/Skyrim-1.7.104/SKSE/Plugins"
          $serverResources = "$root/Server/SkyrimTogetherReborn/resources"

          New-Item -ItemType Directory -Force -Path $common | Out-Null
          New-Item -ItemType Directory -Force -Path $runtime16 | Out-Null
          New-Item -ItemType Directory -Force -Path $runtime17 | Out-Null
          New-Item -ItemType Directory -Force -Path $serverResources | Out-Null

          Copy-Item "package/fomod" "$root/fomod" -Recurse -Force
          Copy-Item "package/Data/SKSE/Plugins/STRPluginMessagingAPI.ini" "$common/STRPluginMessagingAPI.ini"

          Copy-Item "build-16/Release/STRPluginMessagingAPI.dll" "$runtime16/STRPluginMessagingAPI.dll"
          Copy-Item "build-16/Release/STRPluginMessagingBridge.dll" "$runtime16/STRPluginMessagingBridge.dll"

          Copy-Item "build-17/Release/STRPluginMessagingAPI.dll" "$runtime17/STRPluginMessagingAPI.dll"
          Copy-Item "build-17/Release/STRPluginMessagingBridge.dll" "$runtime17/STRPluginMessagingBridge.dll"

          Copy-Item "extras/str-server-resources/strpm-chat-relay" $serverResources -Recurse -Force

          Compress-Archive -Path "$root/*" -DestinationPath $zip -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            $required = @(
              "fomod/info.xml",
              "fomod/ModuleConfig.xml",
              "Common/SKSE/Plugins/STRPluginMessagingAPI.ini",
              "Runtime/Skyrim-1.6.1170/SKSE/Plugins/STRPluginMessagingAPI.dll",
              "Runtime/Skyrim-1.6.1170/SKSE/Plugins/STRPluginMessagingBridge.dll",
              "Runtime/Skyrim-1.7.104/SKSE/Plugins/STRPluginMessagingAPI.dll",
              "Runtime/Skyrim-1.7.104/SKSE/Plugins/STRPluginMessagingBridge.dll",
              "Server/SkyrimTogetherReborn/resources/strpm-chat-relay/main.lua",
              "Server/SkyrimTogetherReborn/resources/strpm-chat-relay/strpm-chat-relay.manifest"
            )
            foreach ($entry in $required) {
              if ($entries -notcontains $entry) {
                throw "Missing archive entry: $entry"
              }
            }
            if ($entries -match "STRPluginMessagingDiagnostic.dll") {
              throw "Diagnostic DLL must not be included in the public release archive."
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: STRPluginMessagingAPI-windows
          path: |
            build-16/Release/STRPluginMessagingAPI.dll
            build-16/Release/STRPluginMessagingBridge.dll
            build-16/Release/STRPluginMessagingDiagnostic.dll
            build-17/Release/STRPluginMessagingAPI.dll
            build-17/Release/STRPluginMessagingBridge.dll
            build-17/Release/STRPluginMessagingDiagnostic.dll

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: STRPluginMessagingAPI-v0.10.1
          path: STRPluginMessagingAPI-v0.10.1.zip
